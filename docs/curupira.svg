<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240"
     role="img" aria-labelledby="titulo descricao" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="titulo">Curupira</title>
  <desc id="descricao">Um rastro de pegadas sobe pela mata, mas os dedos apontam
  para trás — quem seguir as marcas anda no sentido errado. Acima, a coroa de
  chamas do Curupira. Marca do benchmark Curupira.</desc>

  <defs>
    <linearGradient id="mata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#154932"/>
      <stop offset="1" stop-color="#09261A"/>
    </linearGradient>
    <linearGradient id="fogo" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#D93B25"/>
      <stop offset="0.5" stop-color="#EF6A24"/>
      <stop offset="1" stop-color="#F8C13A"/>
    </linearGradient>

    <!-- Uma pegada: sola e os cinco dedos num arco apertado logo abaixo dela.
         Os dedos ficam do lado OPOSTO ao sentido da caminhada — e e por isso
         que o Curupira confunde quem o persegue. -->
    <g id="pegada">
      <ellipse cx="0" cy="0" rx="13.5" ry="20"/>
      <circle cx="-10.5" cy="24.5" r="5.2"/>
      <circle cx="-1"    cy="28"   r="4.6"/>
      <circle cx="7.5"   cy="26.5" r="4"/>
      <circle cx="14"    cy="22"   r="3.4"/>
      <circle cx="18.5"  cy="16.5" r="2.8"/>
    </g>
  </defs>

  <circle cx="120" cy="120" r="116" fill="url(#mata)"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#2A7A53" stroke-width="3"/>

  <!-- A coroa de chamas, nascendo de uma base unica em vez de tres gotas soltas. -->
  <path d="M46 92c4-13 11-22 20-30-3 13 0 22 6 28 2-22 12-39 28-52-4 19 1 32 10 41
           1-28 9-48 22-61 13 13 21 33 22 61 9-9 14-22 10-41 16 13 26 30 28 52
           6-6 9-15 6-28 9 8 16 17 20 30-11-9-23-14-36-14-20 0-36 7-50 20
           -14-13-30-20-50-20-13 0-25 5-36 14z"
        fill="url(#fogo)"/>

  <!-- O rastro: sobe para a direita, com as marcas apontando para a esquerda. -->
  <g fill="#EFE4CC">
    <g transform="translate(66 182) rotate(22) scale(0.7)" opacity="0.45">
      <use href="#pegada"/>
    </g>
    <g transform="translate(108 156) rotate(22) scale(0.88)" opacity="0.7">
      <use href="#pegada"/>
    </g>
    <g transform="translate(154 128) rotate(22) scale(1.06)">
      <use href="#pegada"/>
    </g>
  </g>
</svg>
