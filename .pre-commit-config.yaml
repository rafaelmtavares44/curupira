# Curupira — pre-commit.
#
# DECISAO DELIBERADA: todos os hooks de qualidade rodam como `language: system`,
# usando as versoes PINADAS no pyproject.toml, em vez de repos remotos com `rev`.
# Motivo: garante que o pre-commit, o CI e a maquina do dev usem exatamente a
# mesma versao de cada ferramenta. Um `rev` de repo remoto desincroniza disso e
# vira uma segunda arvore de dependencias nao auditada — que e exatamente a
# classe de problema da ADR 0002.
#
# Requisito: `pip install -e ".[dev]"` antes de `pre-commit install`.
#
# Tudo e invocado por `python -m`, NUNCA pelo nome do executavel. Motivo: o nome
# no PATH pode resolver para um binario instalado global, de outra versao — e ai
# o hook de versoes passa (o PACOTE pinado esta instalado) enquanto o lint roda
# com regras de outra versao. Ja aconteceu; `scripts/checar_versoes.py` agora
# denuncia, e o `python -m` impede.

default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  - repo: local
    hooks:
      # PRIMEIRO hook de proposito: `language: system` usa o que estiver no PATH.
      # Se o commit sair de um shell sem o venv ativo, o mypy que roda pode ser
      # outro — e passar por engano. Este hook recusa antes de qualquer analise.
      - id: versoes-das-ferramentas
        name: ferramentas na versao pinada
        entry: python scripts/checar_versoes.py
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff (lint)
        entry: python -m ruff check --force-exclude
        language: system
        stages: [pre-commit]
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff (format)
        entry: python -m ruff format --force-exclude
        language: system
        stages: [pre-commit]
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy --strict
        entry: python -m mypy
        language: system
        stages: [pre-commit]
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: bandit
        name: bandit
        entry: python -m bandit -c pyproject.toml -q -r src
        language: system
        stages: [pre-commit]
        types: [python]
        pass_filenames: false
        require_serial: true

      # --exclude-secrets ignora um achado cujo VALOR seja exatamente 64
      # hexadecimais minusculos: a forma de um SHA-256. Toda suite congelada
      # tem uma linha dessas por tarefa, e sem isto o portao acusaria 60 falsos
      # positivos numa suite de 60 tarefas -- e alguem acabaria desligando o
      # hook inteiro, que e o desfecho ruim de verdade.
      #
      # Nao usamos --exclude-files aqui de proposito: cegaria tambem a errata,
      # que mora em suites/ e tem campo de texto livre.
      #
      # tests/test_detect_secrets.py le esta linha e prova que o detector
      # continua pegando chave de provedor. Mudou aqui, o teste cobra.
      - id: detect-secrets
        name: detect-secrets
        entry: python -m detect_secrets.pre_commit_hook --baseline .secrets.baseline --exclude-secrets ^[0-9a-f]{64}$
        language: system
        stages: [pre-commit]
        require_serial: true

      - id: pytest-rapido
        name: pytest (sem marcadores lentos)
        entry: python -m pytest -q -m "not lento and not integracao"
        language: system
        stages: [pre-commit]
        types: [python]
        pass_filenames: false
        require_serial: true

      # O gatilho que `default_install_hook_types` pedia desde a Fase 0 e que ate
      # a Entrega 7 nao tinha hook nenhum. Enquanto nao tinha, o portao exigia
      # Conventional Commits no papel e nao verificava nada; e, como nenhum hook
      # declarava `stages`, a lista inteira era candidata aos dois gatilhos e a
      # segunda leva saia como "Skipped (no files to check)".
      - id: conventional-commits
        name: mensagem de commit (Conventional Commits)
        entry: python scripts/checar_mensagem_de_commit.py
        language: system
        stages: [commit-msg]
