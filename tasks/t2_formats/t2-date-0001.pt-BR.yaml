# ARMADILHA DA CONVENCAO DE DATA, versao ambigua.
#
# `05/03/2026` e 5 de marco no Brasil. Um modelo que carrega a convencao
# anglofona le mes-dia e agenda 3 de MAIO -- dois meses de erro, sem nenhum
# sinal de que errou. E o tipo de falha que so aparece quando alguem nao
# comparece a reuniao.
id: t2-date-0001
schema_version: 1
task_version: 2

track: t2_formats
locale: pt-BR
split: public
difficulty: 2
tags: [data, convencao-dd-mm, propenso-a-falha-silenciosa]

pair_id: date-0001
parity: strict
parity_notes: >-
  Apenas o idioma e a convencao de data correspondente mudam: `05/03/2026`
  em pt-BR, `03/05/2026` em en-US, com o usuario morando no Brasil e nos
  Estados Unidos. Mesmo gabarito ISO (2026-03-05). SIMETRIA, ao contrario do
  par money-*: a ambiguidade intrinseca e o erro tipico (2026-05-03) sao os
  mesmos nos dois lados. Desde a v2 o system_prompt ancora o pais: sem ele,
  `03/05/2026` em ingles e ambiguo de verdade (EUA x Reino Unido), e
  perguntar era a resposta certa -- o primeiro piloto mostrou isso.
generated_from: pt-BR

# Familia: as tarefas date-* nascem do mesmo molde -- data numerica curta que
# precisa virar ISO. Quem entende a convencao dd/mm acerta a familia inteira;
# quem casa padrao acerta um subconjunto. Sao UMA observacao independente, e o
# bootstrap do Delta reamostra por aqui (ADR 0006).
family_id: data-ambigua

variant_group: date-conv-01

canary_guid: c1f4a780-curupira-nao-treinar-neste-dado

context:
  tools:
    - name: agendar_reuniao
      description: Agenda uma reunião de dia inteiro no calendário da equipe.
      parameters:
        type: object
        properties:
          data_iso: {type: string}
          titulo:   {type: string}
        required: [data_iso, titulo]

    # Ferramentas padrao de abstencao, presentes em TODA tarefa.
    # Tornam a abstencao detectavel por AST, sem juiz e sem lexico de hedge.
    - name: pedir_esclarecimento
      description: Use quando faltar informação para executar o pedido com segurança.
      parameters:
        type: object
        properties:
          campo_faltante: {type: string, enum: [data_iso, titulo]}
          pergunta: {type: string}
        required: [campo_faltante, pergunta]

    - name: recusar
      description: Use quando não for possível ou apropriado executar o pedido.
      parameters:
        type: object
        properties:
          motivo: {type: string}
        required: [motivo]

  # v2: ancora o pais. Sem ela, a ambiguidade de 03/05 em ingles e real
  # (EUA x Reino Unido) e perguntar seria a resposta certa.
  system_prompt: "O usuário mora no Brasil."

input:
  user_message: "marca a reunião de orçamento pro dia 05/03/2026"

expect:
  kind: tool_call
  calls:
    - name: agendar_reuniao
      args:
        data_iso: "2026-03-05"
        titulo: "reunião de orçamento"
      arg_specs:
        # REGUA ISO-ONLY, e simetrica de proposito. O argumento se chama
        # `data_iso` e o schema da ferramenta pede ISO: devolver a data na
        # grafia da entrada nao e a conversao que a tarefa cobra, e aceita-la
        # premiaria o nao-trabalho -- em PT-BR mais do que em EN-US, porque
        # `05/03/2026` lido como dd/mm bate com o gabarito e `03/05/2026` nao.
        # Ver `matchers.numerico.data_iso` e o lint `regua-de-data-explicita`.
        data_iso: {matcher: data_iso, params: {formatos_aceitos: ["%Y-%m-%d"]}}
        titulo:   {matcher: fuzzy_name, params: {threshold: 0.7}}
      extra_args: reject

  silent_failure_if:
    - arg: data_iso
      equals: "2026-05-03"
      label: leu_a_data_como_mes_dia
