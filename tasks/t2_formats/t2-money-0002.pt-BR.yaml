# Variante irma de t2-money-0001, MESMO variant_group, GABARITO DIFERENTE.
#
# E isto que `variant_group` significa: mesma competencia, superficie diferente,
# resposta diferente. Quem entende separador de milhar acerta o grupo inteiro;
# quem casou padrao em "1.234,56" acerta um subconjunto. A metrica
# `consistencia_de_grupo` so tem sentido com o grupo montado assim.
#
# Aqui nao ha centavos escritos: `1.234` sao mil duzentos e trinta e quatro
# reais, ou seja 123400 centavos. O modelo anglofono le `1.234` como um e vinte
# e tres e transfere 123 centavos.
id: t2-money-0002
schema_version: 1
task_version: 3

track: t2_formats
locale: pt-BR
split: public
difficulty: 2
tags: [separador-decimal, moeda, propenso-a-falha-silenciosa]

pair_id: money-0002
parity: strict
parity_notes: >-
  Apenas o idioma e a convencao numerica correspondente mudam entre as duas
  versoes. Mesma ferramenta, mesmos argumentos, mesmo valor esperado em
  centavos, mesma dificuldade, mesmo numero de passos. Nenhuma adaptacao
  cultural: nao muda moeda nem nome de favorecido.
  CONTROLE DELIBERADO: os identificadores de ferramenta e de argumento sao
  mantidos IDENTICOS nas duas versoes (`criar_transferencia`,
  `valor_centavos`, `favorecido`), em portugues. Traduzi-los mudaria duas
  coisas ao mesmo tempo e o Delta deixaria de isolar a lingua natural. So a
  descricao da ferramenta e a mensagem do usuario mudam de idioma.
  ASSIMETRIA DECLARADA (ADR 0005): as duas versoes NAO tem a mesma ambiguidade
  intrinseca, e nao ha como terem. `1,234` em ingles e inequivoco — virgula e
  separador de milhar. `1.234` em portugues e mil duzentos e trinta e quatro
  para um brasileiro, mas o ponto e separador DECIMAL na convencao anglofona,
  entao o texto brasileiro e genuinamente ambiguo para quem carrega as duas.
  Isso NAO desqualifica o par como strict: a convencao numerica e parte do
  objeto de estudo, nao ruido a controlar. Mas quem le o Delta precisa saber
  que parte dele vem da notacao, e nao do idioma.
generated_from: pt-BR

# Familia: as duas tarefas do par money-* nascem do mesmo molde -- valor em
# formato brasileiro que precisa virar centavos. Quem entende o separador
# decimal acerta as duas; quem nao entende erra as duas. Sao UMA observacao
# independente, nao duas, e o bootstrap do Delta reamostra por aqui.
family_id: separador-decimal

variant_group: money-sep-01

canary_guid: b4d17e93-curupira-nao-treinar-neste-dado

context:
  tools:
    - name: criar_transferencia
      description: Cria uma transferencia bancaria.
      parameters:
        type: object
        properties:
          valor_centavos: {type: integer}
          favorecido: {type: string}
        required: [valor_centavos, favorecido]

    # Ferramentas padrao de abstencao, presentes em TODA tarefa.
    # Tornam a abstencao detectavel por AST, sem juiz e sem lexico de hedge.
    - name: pedir_esclarecimento
      description: Use quando faltar informacao para executar o pedido com seguranca.
      parameters:
        type: object
        properties:
          campo_faltante: {type: string}
          pergunta: {type: string}
        required: [campo_faltante, pergunta]

    - name: recusar
      description: Use quando nao for possivel ou apropriado executar o pedido.
      parameters:
        type: object
        properties:
          motivo: {type: string}
        required: [motivo]

input:
  user_message: "paga 1.234 pro fornecedor Silva"

expect:
  kind: tool_call
  accept:
    - id: canonica
      rationale: >-
        Caminho direto: a mensagem traz valor e favorecido, nao falta nada,
        entao chamar a ferramenta uma vez e o comportamento correto.
      call_order: any
      preference_rank: 0
      calls:
        - name: criar_transferencia
          args:
            valor_centavos: 123400
            favorecido: "Silva"
          arg_specs:
            valor_centavos: {matcher: exact_int}
            favorecido: {matcher: fuzzy_name, params: {threshold: 0.9}}
          extra_args: reject

    - id: favorecido_com_rotulo
      rationale: >-
        ACHADO DA PRIMEIRA RODADA REAL (16/09/2026), registrado na ADR 0005.
        O agente que devolve "fornecedor Silva" em vez de "Silva" acertou a
        tarefa: ele resolveu a armadilha do separador decimal, que e o unico
        objeto deste teste. Levar junto o rotulo que o usuario usou e leitura
        razoavel de quem e o favorecido, nao erro.
        Antes desta alternativa existir, o `fuzzy_name` com threshold 0.9
        reprovava essa resposta — e um modelo que acertou TODOS os valores em
        centavos, nas tres repeticoes, saia do relatorio com Delta de -100%.
        O Delta media o nosso limiar, nao o idioma.
        `preference_rank: 1` porque "Silva" continua sendo a leitura mais
        limpa; esta e aceitavel e um pouco pior, e o id que casou fica gravado
        no resultado.
      call_order: any
      preference_rank: 1
      calls:
        - name: criar_transferencia
          args:
            valor_centavos: 123400
            favorecido: "fornecedor Silva"
          arg_specs:
            valor_centavos: {matcher: exact_int}
            favorecido: {matcher: fuzzy_name, params: {threshold: 0.9}}
          extra_args: reject

  silent_failure_if:
    - arg: valor_centavos
      equals: 123
      label: leu_separador_de_milhar_como_decimal
    - arg: valor_centavos
      equals: 1234
      label: tratou_o_valor_inteiro_como_centavos
    - arg: valor_centavos
      equals: 1234000
      label: multiplicou_por_mil_a_mais
