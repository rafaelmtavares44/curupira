# Sister variant of t2-date-0002, SAME variant_group, DIFFERENT expected value.
#
# Day 19 is greater than 12, so the date is unambiguous under either
# convention. Getting this one right while missing date-0001 is pattern
# matching, not understanding.
id: t2-date-0002-en
schema_version: 1
task_version: 2

track: t2_formats
locale: en-US
split: public
difficulty: 2
tags: [data, convencao-dd-mm, propenso-a-falha-silenciosa]

pair_id: date-0002
parity: strict
parity_notes: >-
  Apenas o idioma e a convencao de data correspondente mudam: `19/08/2026`
  em pt-BR, `08/19/2026` em en-US, com o usuario morando no Brasil e nos
  Estados Unidos. Mesmo gabarito ISO (2026-08-19). ESTE PAR E O CONTROLE: o
  dia e 19, maior que 12, e a data NAO e ambigua em convencao nenhuma. Quem
  errar este e o 0001 tem problema em converter para ISO, nao com dd/mm. A
  ancora de pais e a reuniao de dia inteiro (v2) sao as mesmas do par 0001.
generated_from: pt-BR

# Familia: as tarefas date-* nascem do mesmo molde -- data numerica curta que
# precisa virar ISO. Quem entende a convencao dd/mm acerta a familia inteira;
# quem casa padrao acerta um subconjunto. Sao UMA observacao independente, e o
# bootstrap do Delta reamostra por aqui (ADR 0006).
family_id: data-ambigua

variant_group: date-conv-01-en

canary_guid: f4a7dab3-curupira-nao-treinar-neste-dado

context:
  tools:
    - name: agendar_reuniao
      description: Schedules an all-day meeting on the team calendar.
      parameters:
        type: object
        properties:
          data_iso: {type: string}
          titulo:   {type: string}
        required: [data_iso, titulo]

    # Ferramentas padrao de abstencao, presentes em TODA tarefa.
    # Tornam a abstencao detectavel por AST, sem juiz e sem lexico de hedge.
    - name: pedir_esclarecimento
      description: Use when information needed to carry out the request safely is missing.
      parameters:
        type: object
        properties:
          campo_faltante: {type: string, enum: [data_iso, titulo]}
          pergunta: {type: string}
        required: [campo_faltante, pergunta]

    - name: recusar
      description: Use when the request cannot or should not be carried out.
      parameters:
        type: object
        properties:
          motivo: {type: string}
        required: [motivo]

  # v2: ancora o pais. Sem ela, a ambiguidade de 03/05 em ingles e real
  # (EUA x Reino Unido) e perguntar seria a resposta certa.
  system_prompt: "The user lives in the United States."

input:
  user_message: "schedule the planning meeting for 08/19/2026"

expect:
  kind: tool_call
  calls:
    - name: agendar_reuniao
      args:
        data_iso: "2026-08-19"
        titulo: "planning meeting"
      arg_specs:
        # REGUA ISO-ONLY, e simetrica de proposito. O argumento se chama
        # `data_iso` e o schema da ferramenta pede ISO: devolver a data na
        # grafia da entrada nao e a conversao que a tarefa cobra, e aceita-la
        # premiaria o nao-trabalho -- em PT-BR mais do que em EN-US, porque
        # `05/03/2026` lido como dd/mm bate com o gabarito e `03/05/2026` nao.
        # Ver `matchers.numerico.data_iso` e o lint `regua-de-data-explicita`.
        data_iso: {matcher: data_iso, params: {formatos_aceitos: ["%Y-%m-%d"]}}
        titulo:   {matcher: fuzzy_name, params: {threshold: 0.7}}
      extra_args: reject

  silent_failure_if:
    - arg: data_iso
      equals: "2026-19-08"
      label: inverteu_mesmo_com_dia_maior_que_doze
