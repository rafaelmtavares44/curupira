# Exemplo canonico da Parte A, na forma `accept` decidida na Parte B.
#
# Esta e a armadilha do separador decimal: `1.234,56` em portugues e mil
# duzentos e trinta e quatro reais e cinquenta e seis centavos. Um modelo
# anglofono le o ponto como separador decimal e transfere mil vezes mais.
id: t2-money-0001
schema_version: 1
task_version: 1

track: t2_formats
locale: pt-BR
split: public
difficulty: 2
tags: [separador-decimal, moeda, propenso-a-falha-silenciosa]

pair_id: money-0001
parity: strict
parity_notes: >-
  Apenas o idioma e a convencao numerica correspondente mudam entre as duas
  versoes. Mesma ferramenta, mesmos argumentos, mesmo valor esperado em
  centavos, mesma dificuldade, mesmo numero de passos. Nenhuma adaptacao
  cultural: nao muda moeda nem nome de favorecido.
  CONTROLE DELIBERADO: os identificadores de ferramenta e de argumento sao
  mantidos IDENTICOS nas duas versoes (`criar_transferencia`,
  `valor_centavos`, `favorecido`), em portugues. Traduzi-los mudaria duas
  coisas ao mesmo tempo e o Delta deixaria de isolar a lingua natural. So a
  descricao da ferramenta e a mensagem do usuario mudam de idioma.
generated_from: pt-BR

variant_group: money-sep-01

canary_guid: 7f3a9c21-curupira-nao-treinar-neste-dado

context:
  tools:
    - name: criar_transferencia
      description: Cria uma transferencia bancaria.
      parameters:
        type: object
        properties:
          valor_centavos: {type: integer}
          favorecido: {type: string}
        required: [valor_centavos, favorecido]

    # Ferramentas padrao de abstencao, presentes em TODA tarefa.
    # Tornam a abstencao detectavel por AST, sem juiz e sem lexico de hedge.
    - name: pedir_esclarecimento
      description: Use quando faltar informacao para executar o pedido com seguranca.
      parameters:
        type: object
        properties:
          campo_faltante: {type: string}
          pergunta: {type: string}
        required: [campo_faltante, pergunta]

    - name: recusar
      description: Use quando nao for possivel ou apropriado executar o pedido.
      parameters:
        type: object
        properties:
          motivo: {type: string}
        required: [motivo]

input:
  user_message: "faz uma transferencia de 1.234,56 pro fornecedor Silva"

expect:
  kind: tool_call
  accept:
    - id: canonica
      rationale: >-
        Caminho direto: a mensagem traz valor e favorecido, nao falta nada,
        entao chamar a ferramenta uma vez e o comportamento correto.
      call_order: any
      preference_rank: 0
      calls:
        - name: criar_transferencia
          args:
            valor_centavos: 123456
            favorecido: "Silva"
          arg_specs:
            valor_centavos: {matcher: exact_int}
            favorecido: {matcher: fuzzy_name, params: {threshold: 0.9}}
          extra_args: reject

  silent_failure_if:
    - arg: valor_centavos
      equals: 123456000
      label: leu_ponto_como_decimal
    - arg: valor_centavos
      equals: 1234
      label: truncou_centavos
    - arg: valor_centavos
      equals: 123456789
      label: ignorou_pontuacao_e_concatenou
