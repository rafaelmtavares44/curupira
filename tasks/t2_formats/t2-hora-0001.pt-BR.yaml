# ARMADILHA DO 'QUINZE PRAS TRES DA TARDE'. Sao 14:45. Dois erros tipicos:
# ler 'quinze pras tres' como 'tres e quinze' (15:15) e ignorar 'da tarde'
# (02:45). A primeira versao ('2 da tarde') era fraca demais -- quase
# ninguem ignora 'da tarde'. Proposta da revisao independente.
