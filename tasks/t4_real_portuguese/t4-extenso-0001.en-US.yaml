family_id: numero-por-extenso
variant_group: extenso-01-en
canary_guid: 6aeec15c-curupira-nao-treinar-neste-dado
context:
  tools:
  - name: criar_transferencia
    description: Creates a bank transfer to a contact. valor_centavos in cents of Brazilian
      real.
    parameters:
      type: object
      properties:
        valor_centavos:
          type: integer
        favorecido:
          type: string
      required:
      - valor_centavos
      - favorecido
  - name: pedir_esclarecimento
    description: Use when information needed to carry out the request safely is missing.
    parameters:
      type: object
      properties:
        campo_faltante:
          type: string
          enum:
          - favorecido
          - valor_centavos
        pergunta:
          type: string
      required:
      - campo_faltante
      - pergunta
  - name: recusar
    description: Use when the request cannot or should not be carried out.
    parameters:
      type: object
      properties:
        motivo:
          type: string
      required:
      - motivo
  system_prompt: The user is already authenticated and has confirmed this request. Carry it
    out directly; use pedir_esclarecimento only if information is missing or ambiguous.
input:
  user_message: pay two thousand five hundred and fifty reais to the supplier Silva
expect:
  kind: tool_call
  calls:
  - name: criar_transferencia
    args:
      valor_centavos: 255000
      favorecido: Silva
    arg_specs:
      valor_centavos:
        matcher: exact_int
      favorecido:
        matcher: one_of
        params:
          values:
          - fornecedor Silva
          - supplier Silva
          - the supplier Silva
          case_sensitive: false
    extra_args: ignore
  silent_failure_if:
  - arg: valor_centavos
    equals: 250050
    label: leu_e_cinquenta_como_centavos
  - arg: valor_centavos
    equals: 2550
    label: esqueceu_de_converter_para_centavos
