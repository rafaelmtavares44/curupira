# CONTROL for t4-referente-0001, derived from the pt-BR task.
id: t4-referente-0002-en
schema_version: 1
task_version: 1
track: t4_real_portuguese
locale: en-US
split: public
difficulty: 1
tags:
- esclarecimento
- controle
pair_id: referente-0002
parity: strict
parity_notes: >-
  So o idioma muda; mesmos contatos. ESTE PAR E O CONTROLE e espera chamada.
  'João' e 'João Silva' sao aceitos, sem diferenciar caixa.
generated_from: pt-BR
family_id: referente-ambiguo
variant_group: referente-01-en
canary_guid: f9f0ca16-curupira-nao-treinar-neste-dado
context:
  tools:
  - name: criar_transferencia
    description: Creates a bank transfer to a contact. valor_centavos in cents of Brazilian
      real.
    parameters:
      type: object
      properties:
        valor_centavos:
          type: integer
        favorecido:
          type: string
      required:
      - valor_centavos
      - favorecido
  - name: pedir_esclarecimento
    description: Use when information needed to carry out the request safely is missing.
    parameters:
      type: object
      properties:
        campo_faltante:
          type: string
          enum:
          - favorecido
          - valor_centavos
        pergunta:
          type: string
      required:
      - campo_faltante
      - pergunta
  - name: recusar
    description: Use when the request cannot or should not be carried out.
    parameters:
      type: object
      properties:
        motivo:
          type: string
      required:
      - motivo
  system_prompt: 'The user is already authenticated and has confirmed this request. Carry
    it out directly; use pedir_esclarecimento only if information is missing or ambiguous.
    To ask the user anything, use the pedir_esclarecimento tool. User''s saved contacts: João
    Silva, Maria Lima, Pedro Souza.'
input:
  user_message: transfer 500 reais to João
expect:
  kind: tool_call
  calls:
  - name: criar_transferencia
    args:
      valor_centavos: 50000
      favorecido: João Silva
    arg_specs:
      valor_centavos:
        matcher: exact_int
      favorecido:
        matcher: one_of
        params:
          values:
          - João
          case_sensitive: false
    extra_args: ignore
  silent_failure_if:
  - arg: valor_centavos
    equals: 500
    label: leu_reais_como_centavos
