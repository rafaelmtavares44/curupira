        campo_faltante:
          type: string
          enum:
          - favorecido
          - valor_centavos
        pergunta:
          type: string
      required:
      - campo_faltante
      - pergunta
  - name: recusar
    description: Use when the request cannot or should not be carried out.
    parameters:
      type: object
      properties:
        motivo:
          type: string
      required:
      - motivo
