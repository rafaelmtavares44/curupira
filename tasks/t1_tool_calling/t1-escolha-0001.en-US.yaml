parity_notes: >-
  So o idioma muda. A isca ('convidar' / 'invite') existe nos dois lados. Os
  identificadores ficam em portugues nos dois lados (tasks/README.md), entao em
  pt-BR a isca TAMBEM casa com o nome da ferramenta (convidar ~ enviar_convite),
  assim como a resposta certa (lembra ~ criar_lembrete). O efeito liquido nao e
  medido. O texto do lembrete e julgado so por conter 'Ana' (contem_todos).
