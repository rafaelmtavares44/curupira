context:
  tools:
  - name: criar_lembrete
    description: Creates a reminder for the user. When to remind goes in the text itself.
    parameters:
      type: object
      properties:
        texto:
          type: string
      required:
      - texto
  - name: enviar_convite
    description: Sends an invitation to an event.
    parameters:
      type: object
      properties:
        convidado:
          type: string
        evento:
          type: string
      required:
      - convidado
      - evento
  - name: pedir_esclarecimento
    description: Use when information needed to carry out the request safely is missing.
    parameters:
      type: object
      properties:
        campo_faltante:
          type: string
          enum:
          - convidado
          - evento
          - texto
        pergunta:
          type: string
      required:
      - campo_faltante
      - pergunta
  - name: recusar
    description: Use when the request cannot or should not be carried out.
    parameters:
      type: object
      properties:
        motivo:
          type: string
      required:
      - motivo
input:
  user_message: remind me tomorrow to invite Ana to Saturday's barbecue
expect:
  kind: tool_call
  calls:
  - name: criar_lembrete
    args:
      texto: Ana
    arg_specs:
      texto:
        matcher: contem_todos
        params:
          termos:
          - Ana
    extra_args: ignore
  silent_failure_if:
  - arg: convidado
    equals: Ana
    label: escolheu_a_ferramenta_pela_palavra
