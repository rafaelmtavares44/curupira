# ARMADILHA DA IRRELEVANCIA. A frase cita mensagem e o Bruno -- os dois
# ingredientes da ferramenta -- e nao pede nada. Quem reage a palavra, e
# nao ao pedido, manda mensagem para o Bruno sem ninguem ter pedido.
# So medivel pelos adaptadores de API: o servidor MCP ainda nao distingue
# 'nao chamou' de 'ainda nao chamou' (ADR 0007 D4).
