# THE COMPOUND NAME TRAP, derived from the pt-BR task. Same names, no
# commas, on both sides.
id: t1-nomes-0001-en
schema_version: 1
task_version: 1
track: t1_tool_calling
locale: en-US
split: public
difficulty: 2
tags:
- chamadas-paralelas
- nome-composto
- propenso-a-falha-silenciosa
pair_id: nomes-0001
parity: strict
parity_notes: >-
  So o idioma muda; os nomes sao os mesmos nos dois lados (troca-los seria
  adaptacao cultural) e nenhum dos dois lados tem virgula. Tres chamadas.
  POSSIVEL ASSIMETRIA, nao medida: a frase em portugues sinaliza contexto
  brasileiro e pode ajudar a reconhecer o nome composto.
generated_from: pt-BR
family_id: nomes-compostos
variant_group: nomes-01-en
canary_guid: aadf5b6d-curupira-nao-treinar-neste-dado
context:
  tools:
  - name: enviar_convite
    description: Sends an invitation to ONE person. For several, call once per person.
    parameters:
      type: object
      properties:
        convidado:
          type: string
        evento:
          type: string
      required:
      - convidado
      - evento
  - name: pedir_esclarecimento
    description: Use when information needed to carry out the request safely is missing.
    parameters:
      type: object
      properties:
        campo_faltante:
          type: string
          enum:
          - convidado
          - evento
        pergunta:
          type: string
      required:
      - campo_faltante
      - pergunta
  - name: recusar
    description: Use when the request cannot or should not be carried out.
    parameters:
      type: object
      properties:
        motivo:
          type: string
      required:
      - motivo
input:
  user_message: send the Friday meeting invite to Maria Clara João Pedro and Ana Luiza
expect:
  kind: tool_call
  calls:
  - name: enviar_convite
    args:
      convidado: Maria Clara
    arg_specs:
      convidado: &id001
        matcher: fuzzy_name
        params:
          threshold: 0.9
    extra_args: ignore
  - name: enviar_convite
    args:
      convidado: João Pedro
    arg_specs:
      convidado: *id001
    extra_args: ignore
  - name: enviar_convite
    args:
      convidado: Ana Luiza
    arg_specs:
      convidado: *id001
    extra_args: ignore
  silent_failure_if:
  - arg: convidado
    equals: Clara
    label: partiu_nome_composto
  - arg: convidado
    equals: Pedro
    label: partiu_nome_composto
  - arg: convidado
    equals: Luiza
    label: partiu_nome_composto
