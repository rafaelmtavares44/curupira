name: ci

# GATILHO: `pull_request`, NUNCA `pull_request_target`.
# `pull_request_target` roda com os secrets do repositorio base e com o codigo do
# PR. Um PR de fork que edite um script de CI viraria comprometimento total.
# Nenhum job deste arquivo usa secret.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  qualidade:
    name: qualidade (py${{ matrix.python }} em ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # O 3.13 esta aqui porque e a versao de desenvolvimento do autor.
        # Ambiente de dev diferente do CI e receita para "na minha maquina roda".
        # O 3.14 entra quando sair de release candidate e as dependencias pinadas
        # publicarem wheels para ele.
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # WINDOWS. Nao e zelo: e divida cobrada.
          #
          # O bug de fim de linha corrigido na Entrega 10 existia desde a
          # Entrega 1 e atravessou 780 testes verdes. O CI so rodava em Linux,
          # onde o modo texto do CPython nao traduz nada; o desenvolvimento so
          # acontecia no Windows, onde traduz. NENHUM DOS DOIS, SOZINHO, VIA O
          # DEFEITO -- e ele atingia justamente o `suite_sha256`, o campo que
          # promete reprodutibilidade.
          #
          # Um benchmark que promete reproducao e testa numa plataforma so esta
          # prometendo o que nao verifica.
          #
          # UMA versao de Python basta aqui: o eixo que este job cobre e o
          # sistema operacional, nao o interpretador. Cruzar 3 x 2 gastaria o
          # dobro do CI para repetir a mesma informacao.
          - os: windows-latest
            python: "3.13"
    steps:
      # RECOMENDACAO: pinar as actions por SHA, nao por tag. O Dependabot
      # (github-actions) mantem os SHAs atualizados via PR.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ferramentas na versao pinada
        run: python scripts/checar_versoes.py

      - name: ruff (lint)
        run: python -m ruff check --output-format=github .

      - name: ruff (format)
        run: python -m ruff format --check .

      - name: mypy --strict
        run: python -m mypy

      - name: pytest
        run: python -m pytest -m "not integracao"

      - name: cobertura minima
        run: python -m coverage report --fail-under=85

  seguranca:
    name: seguranca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: bandit
        run: python -m bandit -c pyproject.toml -q -r src

      # `--strict` (falhar se algo nao pode ser auditado) e incompativel com o
      # proprio pacote instalado em modo editavel. O destino correto e auditar o
      # LOCKFILE COM HASH, nao o ambiente:
      #   python -m pip_audit --strict --require-hashes -r requirements.lock
      # Trocar por essa linha no mesmo PR que gerar o lockfile (ver ADR 0002).
      - name: pip-audit
        run: python -m pip_audit --skip-editable --progress-spinner off

      # ATENCAO, erro ja cometido: `detect-secrets scan --baseline FILE`
      # REESCREVE o arquivo com um `generated_at` novo. Um `git diff
      # --exit-code` depois dele falha SEMPRE — o job ficava vermelho por
      # construcao, e o CI vermelho por construcao e como CI desligado.
      #
      # `detect-secrets-hook` VERIFICA sem reescrever.
      #
      # SEGUNDO ERRO JA COMETIDO, e a razao de existir
      # `test_o_ci_e_o_pre_commit_declaram_a_mesma_politica`: a exclusao dos
      # SHA-256 foi adicionada ao `.pre-commit-config.yaml` e NAO aqui. O portao
      # local ficou verde, o CI ficou vermelho, e este comentario continuou
      # afirmando que os dois rodavam a mesma coisa. Comentario nao e garantia.
      #
      # O involucro DIFERE de proposito -- o pre-commit examina o que esta no
      # indice, aqui examinamos o repositorio inteiro. O que vem depois do nome
      # do modulo tem de ser IDENTICO, e o teste cobra isso.
      - name: detect-secrets
        run: git ls-files -z | xargs -0 python -m detect_secrets.pre_commit_hook --baseline .secrets.baseline --exclude-secrets '^[0-9a-f]{64}$'
        shell: bash

  dataset:
    name: lint do dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # --strict: no CI, aviso do lint conta como erro. Num dataset que vira
      # numero publicado, "quase certo" nao e uma categoria util.
      - name: validar tarefas
        run: python -m curupira.cli validate --strict

      # Confere que toda suite congelada ainda bate com o dataset. Sem isso, uma
      # tarefa editada sem subir task_version so seria descoberta na hora de
      # rodar o benchmark, com a API ja paga.
      - name: conferir suites congeladas
        run: |
          shopt -s nullglob
          for arquivo in suites/*.yaml; do
            nome=$(basename "$arquivo" .yaml)
            case "$nome" in *.errata) continue ;; esac
            echo "::group::suite $nome"
            python -m curupira.cli suite verify "$nome"
            echo "::endgroup::"
          done
        shell: bash
