version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # JANELA DE CARENCIA — ver ADR 0002.
    # Politica do projeto: nenhuma release com menos de 7 dias entra no lockfile.
    # O Dependabot ganhou suporte nativo a essa janela; CONFIRME O NOME DA CHAVE
    # na documentacao vigente antes de descomentar. Ate la, a carencia e regra de
    # revisao humana: PR do Dependabot so e mergeado 7 dias apos a release.
    #
    # cooldown:
    #   default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    # MAJOR de action NAO vira PR automatico.
    #
    # Motivo, aprendido na pratica: os bumps de actions/checkout 4->7 e
    # actions/setup-python 5->7 derrubaram o CI assim que o repositorio subiu.
    # Major de action e breaking change por definicao — muda entrada, saida ou
    # comportamento de seguranca — e um PR automatico vermelho ensina o time a
    # ignorar o CI, que e o unico jeito de perder um CI que funciona.
    #
    # Minor e patch continuam automaticos, que e onde mora a correcao de
    # seguranca. Major vira decisao humana: leia o changelog, atualize a mao.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
