[pytest]
minversion = 9.0
testpaths = tests
# `scripts/` no caminho: os hooks do pre-commit sao codigo e tem teste como
# qualquer outro. Sem isto, o teste do hook precisaria mexer em sys.path.
pythonpath = scripts
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --cov=curupira
    --cov-report=term-missing
    --cov-report=xml
markers =
    lento: teste que faz chamada de rede ou demora (desmarcado por padrao no CI de PR)
    integracao: teste que precisa de chave de API real
filterwarnings =
    error
    ignore::DeprecationWarning:polars.*
# PytestCacheWarning e problema de INFRAESTRUTURA (disco cheio, permissao,
# pasta sincronizada por OneDrive/Dropbox segurando o handle), nao de codigo.
# Escalar para erro derrubava uma suite inteira que tinha passado 80/80 — o
# portao acusava vermelho por um cache que nem e requisito para rodar teste.
    ignore::pytest.PytestCacheWarning
